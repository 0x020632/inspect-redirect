<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />

  <title>CSFloat Inspector</title>

  <style>
    :root {
      --bg: #070a10;
      --card: #0d131e;
      --border: rgba(148, 163, 184, 0.14);
      --accent: #818cf8;
      --text: #eef2f7;
      --muted: #707c90;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(99, 102, 241, 0.10),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #0b0f17 0%,
          #070a10 100%
        );

      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      opacity: 0.18;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 32px 32px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 85%
        );
    }

    .page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      position: relative;

      width: min(760px, 100%);
      height: min(560px, 85vh);

      border-radius: 24px;

      background:
        linear-gradient(
          180deg,
          rgba(18, 24, 37, 0.96),
          rgba(9, 13, 21, 0.98)
        );

      border: 1px solid var(--border);

      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255,255,255,.015);

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 10%;
      right: 10%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(129,140,248,.65),
          transparent
        );
    }

    /*
      Large image area.
      The weapon is centered and never cropped.
    */
    .image-area {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    #itemImage {
      display: none;

      width: 100%;
      height: 100%;

      /*
        IMPORTANT:
        contain = entire weapon remains visible
        no cropping
      */
      object-fit: contain;

      object-position: center center;

      padding: 20px;

      filter:
        drop-shadow(0 24px 35px rgba(0,0,0,.60))
        drop-shadow(0 0 25px rgba(99,102,241,.08));

      user-select: none;
      -webkit-user-drag: none;

      animation: itemIn .45s ease forwards;
    }

    @keyframes itemIn {
      from {
        opacity: 0;
        transform: scale(.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /*
      Very subtle glow behind the weapon.
    */
    .image-glow {
      position: absolute;

      width: 60%;
      height: 45%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(99,102,241,.10),
          transparent 70%
        );

      filter: blur(25px);

      pointer-events: none;
    }

    .placeholder {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 9px;

      color: var(--muted);

      text-align: center;

      font-size: 12px;
    }

    .placeholder-icon {
      width: 44px;
      height: 44px;

      border-radius: 14px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.02);

      color: #8995a8;

      font-size: 20px;
    }

    .placeholder strong {
      color: #aeb7c7;
      font-size: 13px;
    }

    /*
      Small loading indicator.
    */
    .loading-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 14px rgba(129,140,248,.7);

      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: .35;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /*
      Mobile
    */
    @media (max-width: 600px) {
      .page {
        padding: 12px;
      }

      .card {
        width: 100%;
        height: 70vh;

        min-height: 360px;

        border-radius: 20px;
      }

      .image-area {
        padding: 20px;
      }

      #itemImage {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="image-glow"></div>

      <div class="image-area">

        <img
          id="itemImage"
          alt="CS2 item"
        />

        <div
          id="placeholder"
          class="placeholder"
        >
          <div class="placeholder-icon">
            ◈
          </div>

          <strong>
            Loading item
          </strong>

          <div class="loading-dot"></div>
        </div>

      </div>

    </section>

  </main>


  <script type="module">

    const BASE =
      "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en";

    let skinCache = null;


    async function getSkins() {

      if (!skinCache) {

        const response =
          await fetch(
            `${BASE}/skins.json`,
            {
              cache: "force-cache"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Failed to load skins`
          );
        }

        skinCache =
          await response.json();
      }

      return skinCache;
    }


    async function findSkin(
      defindex,
      paintindex
    ) {

      if (
        defindex == null ||
        paintindex == null
      ) {
        return null;
      }

      const skins =
        await getSkins();

      return (
        skins.find(
          skin =>
            Number(
              skin?.weapon?.weapon_id
            ) === Number(defindex) &&

            Number(
              skin?.paint_index
            ) === Number(paintindex)
        ) || null
      );
    }


    /*
      Modern CS2 inspect decoder
    */
    async function decodeInspect(link) {

      try {

        const module =
          await import(
            "https://esm.sh/@csfloat/cs2-inspect-serializer@1.1.6"
          );

        if (
          typeof module.decodeLink ===
          "function"
        ) {

          const data =
            await module.decodeLink(link);

          if (
            data &&
            typeof data === "object"
          ) {
            return data;
          }
        }

      } catch (error) {

        console.debug(
          "Inspect decoder unavailable",
          error
        );

      }

      return {};
    }


    /*
      Open the Steam inspect link.
      This remains automatic, but there is
      no visible inspect UI.
    */
    function openSteam(link) {

      try {

        window.location.href = link;

      } catch (error) {

        console.error(
          "Steam launch failed",
          error
        );

      }
    }


    async function init() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const inspectLink =
        params.get("link");


      if (!inspectLink) {

        document.querySelector(
          "#placeholder strong"
        ).textContent =
          "No inspect link";

        document.querySelector(
          ".loading-dot"
        ).style.display =
          "none";

        return;
      }


      const link =
        inspectLink.trim();


      try {

        /*
          Decode inspect link
        */
        const data =
          await decodeInspect(link);


        const defindex =
          data.defindex ??
          data.def_index ??
          null;


        const paintindex =
          data.paintindex ??
          data.paint_index ??
          null;


        /*
          Find matching skin
        */
        const skin =
          await findSkin(
            defindex,
            paintindex
          );


        /*
          Load item image
        */
        if (skin?.image) {

          const image =
            document.querySelector(
              "#itemImage"
            );

          const placeholder =
            document.querySelector(
              "#placeholder"
            );


          image.onload = () => {

            /*
              Force image to be shown
              only after it has loaded.
            */
            image.style.display =
              "block";

            placeholder.style.display =
              "none";

          };


          image.onerror = () => {

            placeholder.querySelector(
              "strong"
            ).textContent =
              "Image unavailable";

            placeholder.querySelector(
              ".loading-dot"
            ).style.display =
              "none";

          };


          image.src =
            skin.image;

        } else {

          document.querySelector(
            "#placeholder strong"
          ).textContent =
            "Item preview unavailable";

          document.querySelector(
            ".loading-dot"
          ).style.display =
            "none";
        }


        /*
          Automatically launch Steam shortly
          after the item has loaded.
        */
        setTimeout(
          () => openSteam(link),
          700
        );


      } catch (error) {

        console.error(error);

        document.querySelector(
          "#placeholder strong"
        ).textContent =
          "Unable to load item";

        document.querySelector(
          ".loading-dot"
        ).style.display =
          "none";


        /*
          Still open Steam even if
          the catalog lookup fails.
        */
        setTimeout(
          () => openSteam(link),
          500
        );

      }

    }


    init();

  </script>

</body>
</html>
